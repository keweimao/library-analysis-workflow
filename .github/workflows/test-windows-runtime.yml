name: Test Windows local model setup

on:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Download and start Ollama; pull small model
        run: python packaging/smoke_runtime.py
