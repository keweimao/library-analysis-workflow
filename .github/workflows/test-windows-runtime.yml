name: Test Windows local model setup

on:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Build packaged executable
        run: python packaging/build_desktop.py
      - name: Install and start from packaged executable
        shell: pwsh
        run: |
          $home = Join-Path $env:RUNNER_TEMP 'library-packaged-test'
          & .\dist\desktop-build\LibraryAnalysis\LibraryAnalysis.exe install --model qwen3.5:0.8b --home $home
          if ($LASTEXITCODE -ne 0) { throw "Packaged installation failed: $LASTEXITCODE" }
          & .\dist\desktop-build\LibraryAnalysis\LibraryAnalysis.exe start --health-only --no-browser --home $home
          if ($LASTEXITCODE -ne 0) { throw "Packaged startup failed: $LASTEXITCODE" }
